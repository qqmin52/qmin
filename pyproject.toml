[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmin"
version = "0.1.0"
description = "极简 QQ 官方机器人框架"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi",
    "uvicorn[standard]",
    "aiosqlite",
    "qq-botpy-sdk",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
qmin = "core.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["core*", "api*"]

# 把前端构建产物（api/static）打进 wheel：安装后 qmin start 直接有面板。
[tool.setuptools.package-data]
api = ["static/*", "static/**/*"]
