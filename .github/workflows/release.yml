name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: 安装前端依赖
        working-directory: webui
        run: npm ci

      - name: 构建前端
        working-directory: webui
        run: npm run build

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装构建工具
        run: pip install build

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 上传 wheel 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
